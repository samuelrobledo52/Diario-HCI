<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <pattern id="geo" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <polygon points="10,0 20,10 10,20 0,10" fill="none" stroke="#1a3a2a" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Can body -->
  <rect x="120" y="30" width="160" height="240" rx="12" fill="#0a2218"/>
  <rect x="120" y="30" width="160" height="240" rx="12" fill="url(#geo)"/>

  <!-- Can top/bottom -->
  <ellipse cx="200" cy="30" rx="80" ry="12" fill="#1a3a28"/>
  <ellipse cx="200" cy="270" rx="80" ry="12" fill="#0d2518"/>

  <!-- Highlight stripe -->
  <rect x="230" y="30" width="20" height="240" rx="6" fill="white" opacity="0.05"/>

  <!-- Main logo - FIGURE (high contrast, stands out) -->
  <ellipse cx="200" cy="150" rx="55" ry="55" fill="#00e676" opacity="0.95"/>
  <text x="200" y="138" fill="#0a2218" font-size="11" text-anchor="middle" font-weight="bold">ENERGY</text>
  <text x="200" y="155" fill="#0a2218" font-size="26" text-anchor="middle" font-weight="bold">⚡</text>
  <text x="200" y="172" fill="#0a2218" font-size="11" text-anchor="middle" font-weight="bold">BOOST</text>

  <!-- Brand name -->
  <text x="200" y="90" fill="#00e676" font-size="13" text-anchor="middle" font-weight="bold" letter-spacing="3">ULTRA</text>
  <text x="200" y="225" fill="#4caf50" font-size="8" text-anchor="middle" letter-spacing="2">500ml · ENERGY DRINK</text>

  <!-- Annotations -->
  <!-- FIGURE arrow -->
  <line x1="270" y1="150" x2="310" y2="130" stroke="#00e676" stroke-width="1.5"/>
  <circle cx="270" cy="150" r="3" fill="#00e676"/>
  <text x="312" y="120" fill="#00e676" font-size="9" font-weight="bold">FIGURA</text>
  <text x="312" y="132" fill="#00e676" font-size="8">(logo, alto</text>
  <text x="312" y="143" fill="#00e676" font-size="8">contraste)</text>

  <!-- BACKGROUND arrow -->
  <line x1="145" y1="80" x2="90" y2="70" stroke="#888" stroke-width="1.5"/>
  <circle cx="145" cy="80" r="3" fill="#888"/>
  <text x="30" y="60" fill="#888" font-size="9" font-weight="bold">FONDO</text>
  <text x="30" y="72" fill="#888" font-size="8">(patrón geo</text>
  <text x="30" y="83" fill="#888" font-size="8">queda atrás)</text>

  <text x="200" y="295" fill="#1c1a17" font-size="11" text-anchor="middle" font-weight="bold">Gestalt: Principio de Figura-Fondo</text>
</svg>
