<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#f8f4f0"/>
  <!-- Floor / corridor -->
  <rect x="0" y="120" width="400" height="180" fill="#e8e0d8"/>
  <!-- Walls -->
  <rect x="0" y="0" width="400" height="120" fill="#d4cdc6"/>
  <!-- Ceiling line -->
  <line x1="0" y1="120" x2="400" y2="120" stroke="#b0a89e" stroke-width="2"/>

  <!-- Guide strip on floor - continuity principle -->
  <rect x="0" y="145" width="320" height="18" rx="3" fill="#2d5a3d" opacity="0.85"/>
  <!-- Gap in strip (continuity still works) -->
  <rect x="150" y="145" width="30" height="18" fill="#e8e0d8"/>
  <!-- Strip continues -->
  <rect x="320" y="145" width="80" height="18" rx="3" fill="#2d5a3d" opacity="0.85"/>

  <!-- Arrows on strip -->
  <text x="60" y="159" fill="white" font-size="14" text-anchor="middle">→</text>
  <text x="120" y="159" fill="white" font-size="14" text-anchor="middle">→</text>
  <text x="210" y="159" fill="white" font-size="14" text-anchor="middle">→</text>
  <text x="270" y="159" fill="white" font-size="14" text-anchor="middle">→</text>
  <text x="360" y="159" fill="white" font-size="14" text-anchor="middle">→</text>

  <!-- Signs on wall -->
  <rect x="30" y="40" width="80" height="50" rx="4" fill="#2d5a3d"/>
  <text x="70" y="62" fill="white" font-size="9" text-anchor="middle" font-weight="bold">CAJA</text>
  <text x="70" y="76" fill="white" font-size="18" text-anchor="middle">→</text>

  <rect x="170" y="40" width="80" height="50" rx="4" fill="#2d5a3d"/>
  <text x="210" y="62" fill="white" font-size="9" text-anchor="middle" font-weight="bold">SALIDA</text>
  <text x="210" y="76" fill="white" font-size="18" text-anchor="middle">→</text>

  <rect x="310" y="40" width="80" height="50" rx="4" fill="#2d5a3d"/>
  <text x="350" y="62" fill="white" font-size="9" text-anchor="middle" font-weight="bold">CAJA</text>
  <text x="350" y="76" fill="white" font-size="18" text-anchor="middle">→</text>

  <!-- Gap label -->
  <line x1="165" y1="135" x2="165" y2="175" stroke="#e53e3e" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="180" y1="135" x2="180" y2="175" stroke="#e53e3e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="172" y="200" fill="#e53e3e" font-size="8" text-anchor="middle">brecha</text>
  <text x="172" y="212" fill="#e53e3e" font-size="7" text-anchor="middle">(el ojo igual</text>
  <text x="172" y="222" fill="#e53e3e" font-size="7" text-anchor="middle">sigue la línea)</text>

  <!-- Curved arrow showing eye follows path -->
  <path d="M 20 110 Q 200 90 380 110" stroke="#c97d2e" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
  <polygon points="375,105 385,110 375,115" fill="#c97d2e"/>
  <text x="200" y="105" fill="#c97d2e" font-size="8" text-anchor="middle">el ojo sigue la dirección →</text>

  <text x="200" y="290" fill="#2d5a3d" font-size="11" text-anchor="middle" font-weight="bold">Gestalt: Principio de Continuidad</text>
</svg>
