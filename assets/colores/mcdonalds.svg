<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#DA291C"/>
  <!-- M arches -->
  <g transform="translate(200,140)">
    <path d="M-80,-70 L-80,70 Q-80,80 -65,80 Q-50,80 -50,70 L-50,-10 Q-30,60 0,60 Q30,60 50,-10 L50,70 Q50,80 65,80 Q80,80 80,70 L80,-70 Q80,-85 65,-85 Q50,-85 50,-70 L50,10 Q30,-60 0,-60 Q-30,-60 -50,10 L-50,-70 Q-50,-85 -65,-85 Q-80,-85 -80,-70 Z" fill="#FFC72C"/>
  </g>
  <!-- Color swatches -->
  <rect x="20" y="240" width="40" height="40" rx="6" fill="#DA291C" stroke="white" stroke-width="2"/>
  <text x="40" y="295" fill="white" font-size="8" text-anchor="middle">Rojo</text>
  <rect x="75" y="240" width="40" height="40" rx="6" fill="#FFC72C" stroke="white" stroke-width="2"/>
  <text x="95" y="295" fill="white" font-size="8" text-anchor="middle">Amarillo</text>
  <rect x="130" y="240" width="40" height="40" rx="6" fill="#27251F" stroke="white" stroke-width="2"/>
  <text x="150" y="295" fill="white" font-size="8" text-anchor="middle">Negro</text>

  <!-- Annotations -->
  <rect x="240" y="50" width="145" height="70" rx="8" fill="rgba(0,0,0,0.5)"/>
  <text x="312" y="70" fill="white" font-size="9" text-anchor="middle" font-weight="bold">McDonald's</text>
  <text x="312" y="84" fill="#FFC72C" font-size="8" text-anchor="middle">Rojo = urgencia + apetito</text>
  <text x="312" y="96" fill="#FFC72C" font-size="8" text-anchor="middle">Amarillo = alegría + energía</text>
  <text x="312" y="108" fill="#ddd" font-size="7" text-anchor="middle">Público: familias y jóvenes</text>

  <text x="200" y="230" fill="white" font-size="10" text-anchor="middle" font-weight="bold" opacity="0.8">Análisis de Color — McDonald's</text>
</svg>
