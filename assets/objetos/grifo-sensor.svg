<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#e8ecf0"/>
  <!-- Sink basin -->
  <ellipse cx="200" cy="220" rx="100" ry="30" fill="#c8d0d8"/>
  <ellipse cx="200" cy="215" rx="90" ry="24" fill="#d8e0e8"/>
  <!-- Sink front -->
  <rect x="100" y="215" width="200" height="50" rx="4" fill="#c8d0d8"/>
  <ellipse cx="200" cy="265" rx="100" ry="15" fill="#b8c0c8"/>

  <!-- Faucet pipe -->
  <rect x="188" y="80" width="24" height="120" rx="8" fill="#b0b8c0"/>
  <rect x="190" y="82" width="20" height="116" rx="7" fill="#c8d0d8"/>
  <!-- Shine -->
  <rect x="195" y="85" width="6" height="110" rx="3" fill="white" opacity="0.4"/>

  <!-- Faucet head -->
  <rect x="170" y="70" width="60" height="18" rx="9" fill="#b0b8c0"/>
  <rect x="172" y="72" width="56" height="14" rx="7" fill="#c8d0d8"/>

  <!-- Sensor (the mysterious black dot) -->
  <circle cx="200" cy="155" r="8" fill="#1a1a2e"/>
  <circle cx="200" cy="155" r="5" fill="#0d0d1a"/>
  <circle cx="200" cy="155" r="2" fill="#ff4444"/>
  <!-- Sensor blink -->
  <circle cx="200" cy="155" r="9" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="155" r="13" fill="none" stroke="#ff4444" stroke-width="0.5" opacity="0.3"/>

  <!-- Water drops -->
  <ellipse cx="200" cy="195" rx="3" ry="5" fill="#4a9eff" opacity="0.7"/>
  <ellipse cx="195" cy="205" rx="2" ry="4" fill="#4a9eff" opacity="0.5"/>
  <ellipse cx="205" cy="200" rx="2" ry="4" fill="#4a9eff" opacity="0.5"/>

  <!-- Annotations -->
  <!-- Sensor label -->
  <line x1="213" y1="148" x2="270" y2="120" stroke="#e53e3e" stroke-width="1.5"/>
  <rect x="265" y="100" width="120" height="42" rx="5" fill="white" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="325" y="116" fill="#e53e3e" font-size="8" text-anchor="middle" font-weight="bold">Sensor infrarrojo</text>
  <text x="325" y="128" fill="#666" font-size="7" text-anchor="middle">sin señal visual clara</text>
  <text x="325" y="138" fill="#666" font-size="7" text-anchor="middle">¿altavoz? ¿botón? ¿sensor?</text>

  <!-- No handle label -->
  <line x1="170" y1="79" x2="100" y2="70" stroke="#e53e3e" stroke-width="1.5"/>
  <rect x="10" y="55" width="95" height="32" rx="5" fill="white" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="57" y="68" fill="#e53e3e" font-size="8" text-anchor="middle" font-weight="bold">Sin manija</text>
  <text x="57" y="80" fill="#666" font-size="7" text-anchor="middle">¿cómo se activa?</text>

  <!-- No affordance -->
  <line x1="170" y1="155" x2="100" y2="170" stroke="#f57c00" stroke-width="1.5"/>
  <rect x="10" y="158" width="95" height="32" rx="5" fill="white" stroke="#f57c00" stroke-width="1.5"/>
  <text x="57" y="170" fill="#f57c00" font-size="8" text-anchor="middle" font-weight="bold">Sin affordance</text>
  <text x="57" y="182" fill="#666" font-size="7" text-anchor="middle">no comunica su uso</text>

  <text x="200" y="295" fill="#2d5a3d" font-size="11" text-anchor="middle" font-weight="bold">Grifo automático — Objeto de diseño confuso</text>
</svg>
