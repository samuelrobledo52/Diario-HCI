<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#1a1a1a"/>
  <!-- Phone frame -->
  <rect x="110" y="5" width="180" height="290" rx="22" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <rect x="118" y="20" width="164" height="258" rx="4" fill="#f5f5f0"/>
  <!-- Notch -->
  <rect x="170" y="5" width="60" height="14" rx="7" fill="#1a1a1a"/>

  <!-- Canvas app header -->
  <rect x="118" y="20" width="164" height="36" fill="#e66000"/>
  <text x="200" y="33" fill="white" font-size="9" text-anchor="middle" font-weight="bold">← Detalles de la tarea</text>
  <text x="200" y="48" fill="#ffd0a0" font-size="6" text-anchor="middle">INTERACCIÓN HUMANO COMP...</text>

  <!-- Task title -->
  <text x="128" y="72" fill="#333" font-size="9" font-weight="bold">3 - Modelo de Norman</text>
  <text x="128" y="84" fill="#999" font-size="7">0 pts ⊘ Sin entregas</text>

  <!-- Tabs (confusing) -->
  <rect x="118" y="90" width="164" height="24" fill="#eee"/>
  <rect x="118" y="90" width="54" height="24" fill="white"/>
  <text x="145" y="106" fill="#e66000" font-size="7" text-anchor="middle">Detalles</text>
  <line x1="118" y1="114" x2="172" y2="114" stroke="#e66000" stroke-width="2"/>
  <text x="200" y="106" fill="#999" font-size="7" text-anchor="middle">Entrega</text>
  <text x="256" y="106" fill="#999" font-size="7" text-anchor="middle">Rúbrica</text>
  <!-- vertical dividers -->
  <line x1="172" y1="90" x2="172" y2="114" stroke="#ddd" stroke-width="1"/>
  <line x1="226" y1="90" x2="226" y2="114" stroke="#ddd" stroke-width="1"/>

  <!-- Content area -->
  <rect x="118" y="114" width="164" height="140" fill="white"/>
  <text x="128" y="130" fill="#666" font-size="7">Descripción</text>
  <rect x="128" y="135" width="144" height="6" rx="3" fill="#eee"/>
  <rect x="128" y="145" width="130" height="6" rx="3" fill="#eee"/>
  <rect x="128" y="155" width="144" height="6" rx="3" fill="#eee"/>
  <rect x="128" y="165" width="100" height="6" rx="3" fill="#eee"/>

  <!-- Confusion annotation -->
  <rect x="118" y="175" width="164" height="20" fill="#fff8e1"/>
  <text x="200" y="188" fill="#f57f17" font-size="7" text-anchor="middle">📎 Archivos adjuntos (pestaña aparte)</text>

  <rect x="118" y="196" width="164" height="20" fill="#fce4ec"/>
  <text x="200" y="208" fill="#c62828" font-size="7" text-anchor="middle">📊 Rúbrica... cargando</text>

  <!-- Bottom nav (confusing icons) -->
  <rect x="118" y="254" width="164" height="24" fill="#f5f5f0" stroke="#ddd" stroke-width="1"/>
  <text x="137" y="270" fill="#e66000" font-size="14" text-anchor="middle">⊞</text>
  <text x="164" y="270" fill="#999" font-size="12" text-anchor="middle">📅</text>
  <text x="191" y="270" fill="#999" font-size="12" text-anchor="middle">📋</text>
  <text x="218" y="270" fill="#999" font-size="12" text-anchor="middle">🔔</text>
  <text x="245" y="270" fill="#999" font-size="12" text-anchor="middle">✉</text>

  <!-- Question marks on icons -->
  <text x="164" y="256" fill="#e53e3e" font-size="8" text-anchor="middle">?</text>
  <text x="218" y="256" fill="#e53e3e" font-size="8" text-anchor="middle">?</text>

  <!-- Annotation arrows -->
  <line x1="292" y1="102" x2="255" y2="102" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="98" fill="#e53e3e" font-size="8" text-anchor="middle">3 pestañas</text>
  <text x="318" y="108" fill="#e53e3e" font-size="8" text-anchor="middle">confusas</text>

  <line x1="292" y1="265" x2="255" y2="265" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="330" y="261" fill="#e53e3e" font-size="7" text-anchor="middle">íconos sin</text>
  <text x="330" y="271" fill="#e53e3e" font-size="7" text-anchor="middle">etiquetas</text>

  <text x="200" y="298" fill="#e2e8f0" font-size="9" text-anchor="middle" font-weight="bold">Canvas en móvil — Interfaz confusa</text>
</svg>
