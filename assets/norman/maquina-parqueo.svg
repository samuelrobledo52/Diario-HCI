<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#e8e4de"/>

  <!-- Machine body -->
  <rect x="130" y="20" width="140" height="260" rx="8" fill="#3a3a3a"/>
  <rect x="135" y="25" width="130" height="250" rx="6" fill="#4a4a4a"/>

  <!-- Screen -->
  <rect x="148" y="35" width="104" height="70" rx="4" fill="#001a00"/>
  <rect x="150" y="37" width="100" height="66" rx="3" fill="#003300"/>
  <text x="200" y="58" fill="#00ff41" font-size="9" text-anchor="middle" font-family="monospace">PARQUEO CENTRAL</text>
  <text x="200" y="72" fill="#00cc33" font-size="8" text-anchor="middle" font-family="monospace">Monto a pagar:</text>
  <text x="200" y="87" fill="#00ff41" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">Q 15.00</text>
  <text x="200" y="100" fill="#007700" font-size="7" text-anchor="middle" font-family="monospace">Inserte ticket...</text>

  <!-- Ticket slot -->
  <rect x="158" y="115" width="84" height="12" rx="2" fill="#222"/>
  <rect x="160" y="117" width="80" height="8" rx="1" fill="#111"/>
  <text x="200" y="140" fill="#aaa" font-size="7" text-anchor="middle">↑ RANURA TICKET</text>

  <!-- Card reader -->
  <rect x="158" y="150" width="84" height="50" rx="4" fill="#333"/>
  <rect x="163" y="155" width="74" height="38" rx="3" fill="#222"/>
  <text x="200" y="170" fill="#4a9eff" font-size="7" text-anchor="middle">💳 TARJETA</text>
  <rect x="168" y="175" width="64" height="8" rx="1" fill="#333"/>
  <text x="200" y="182" fill="#666" font-size="6" text-anchor="middle">deslice o inserte</text>
  <text x="200" y="208" fill="#aaa" font-size="7" text-anchor="middle">↑ LECTOR TARJETA</text>

  <!-- Buttons -->
  <circle cx="165" cy="225" r="10" fill="#c0392b"/>
  <text x="165" y="229" fill="white" font-size="8" text-anchor="middle">✕</text>
  <circle cx="200" cy="225" r="10" fill="#f39c12"/>
  <text x="200" y="229" fill="white" font-size="8" text-anchor="middle">←</text>
  <circle cx="235" cy="225" r="10" fill="#27ae60"/>
  <text x="235" y="229" fill="white" font-size="8" text-anchor="middle">✓</text>

  <!-- Problem annotation -->
  <line x1="270" y1="97" x2="340" y2="80" stroke="#e53e3e" stroke-width="1.5"/>
  <rect x="300" y="60" width="90" height="35" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1"/>
  <text x="345" y="74" fill="#e53e3e" font-size="8" text-anchor="middle" font-weight="bold">¿Qué sigue</text>
  <text x="345" y="86" fill="#e53e3e" font-size="8" text-anchor="middle">después?</text>

  <line x1="270" y1="182" x2="320" y2="200" stroke="#e53e3e" stroke-width="1.5"/>
  <rect x="305" y="195" width="90" height="35" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1"/>
  <text x="350" y="209" fill="#e53e3e" font-size="8" text-anchor="middle" font-weight="bold">Sin feedback</text>
  <text x="350" y="221" fill="#e53e3e" font-size="8" text-anchor="middle">al pagar</text>

  <text x="200" y="292" fill="#1a1a1a" font-size="10" text-anchor="middle" font-weight="bold">Máquina de parqueo — Modelo de Norman</text>
</svg>
